services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: b2b-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup

volumes:
  sqldata: